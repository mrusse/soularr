name: docker

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'main'
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'run.sh'
      - '.github/workflows/docker.yaml'

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Forks don't have the Docker Hub secrets, so pushing a branch there failed at "Login to
      # Docker Hub". Only use Docker Hub when the secrets exist (and not for PRs); forks still
      # build and push to their own GHCR (ghcr.io/<owner>/soularr). Secrets can't be used in a
      # step's `if:`, hence this flag.
      PUSH_TO_DOCKERHUB: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.PUSH_TO_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Docker meta (GHCR only)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            
      - name: Determine Docker Hub Tag
        if: env.PUSH_TO_DOCKERHUB == 'true'
        id: hubtag
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            # Docker tags can't contain "/", so a branch like feature/foo becomes feature-foo
            echo "tag=${GITHUB_REF_NAME//\//-}" >> $GITHUB_OUTPUT
          fi
          echo "dockerhub_image=${{ secrets.DOCKERHUB_USERNAME }}/soularr" >> $GITHUB_OUTPUT
          
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.PUSH_TO_DOCKERHUB == 'true' && format('{0}:{1}', steps.hubtag.outputs.dockerhub_image, steps.hubtag.outputs.tag) || '' }}

          labels: ${{ steps.meta.outputs.labels }}
